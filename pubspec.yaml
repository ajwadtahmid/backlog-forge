name: backlogforge
description: "Steam game backlog manager — track, prioritise, and conquer your backlog."
publish_to: "none"

version: 1.1.2+9

environment:
  # Flutter 3.50 ships Dart 3.14. Material comes from the material_ui package
  # since Flutter 3.47, so older SDKs cannot build this app.
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # State management
  flutter_riverpod: ^3.5.0

  # Database — Drift wraps SQLite with type-safe Dart APIs and works
  # natively on Android, iOS, macOS, Windows, and Linux.
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  path: ^1.9.1
  path_provider: ^2.1.6

  flutter_secure_storage: ^11.2.0

  # Compile-time environment variable injection from .env
  envied: ^1.3.10

  # Navigation
  go_router: ^18.1.4

  # Networking + auth
  http: ^1.6.0
  url_launcher: ^6.3.3

  # Lightweight key-value store used for instant theme reads before auth resolves.
  shared_preferences: ^2.5.6

  # UI
  cached_network_image: ^4.0.7
  flutter_slidable: ^5.2.0
  shimmer: ^4.0.0

  # File selection / save dialogs for JSON/CSV import-export
  file_selector: ^1.1.0

  # Stream utilities — used to debounce the stats watch stream
  rxdart: ^0.28.0

  # Typography — Space Grotesk for display/headings
  google_fonts: ^9.0.0

  # App version / build number read from pubspec at runtime
  package_info_plus: ^10.2.2
  flutter_web_auth_2: ^6.0.0

  material_ui: ^1.11.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Drift code generation — turns @DriftDatabase tables into type-safe Dart
  # classes. Run `dart run build_runner build` after editing a table file.
  drift_dev: ^2.35.3
  build_runner: ^2.16.2
  envied_generator: ^1.3.10

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/artwork/
